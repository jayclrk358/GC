# Full Magnox stack. `docker compose up --build` then open https://localhost
# For local development you can start only the backing services:
#   docker compose up -d postgres redis-queue redis-cache mailpit
# On a server, add the production overrides (see docker-compose.prod.yml).
name: magnox

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: ${APP_URL:-https://localhost}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  DATABASE_URL: postgres://magnox:${POSTGRES_PASSWORD:-magnox}@postgres:5432/magnox
  REDIS_QUEUE_URL: redis://redis-queue:6379/0
  REDIS_CACHE_URL: redis://redis-cache:6379/0
  # Uploads go to the shared `media` volume and Caddy serves them from MEDIA_ADDRESS. To use S3
  # (or R2, B2...) instead, set STORAGE_DRIVER=s3, the S3_* values and MEDIA_BASE_URL in .env.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /data/media
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-magnox}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  MEDIA_BASE_URL: ${MEDIA_BASE_URL:-https://media.localhost}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  EMAIL_FROM: ${EMAIL_FROM:-Magnox <no-reply@magnox.local>}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
  TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PLUS_MONTHLY: ${STRIPE_PRICE_PLUS_MONTHLY:-}
  STRIPE_PRICE_PLUS_YEARLY: ${STRIPE_PRICE_PLUS_YEARLY:-}
  STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
  STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: magnox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magnox}
      POSTGRES_DB: magnox
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U magnox']
      interval: 5s
      retries: 10

  # BullMQ requires noeviction and persistence.
  redis-queue:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redisqueue:/data]
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s

  # Caches, rate limits, presence and Socket.IO pub/sub. Evicts least-recently-used keys.
  redis-cache:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']

  # Applies migrations and loads the game catalog (both safe to repeat), then exits.
  migrate:
    build: { context: ., target: app }
    command: ['sh', '-c', 'pnpm db:migrate && pnpm --filter @magnox/db seed']
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_REALTIME_URL: ''
    environment: *app-env
    volumes: [media:/data/media]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-cache: { condition: service_healthy }
    restart: unless-stopped

  realtime:
    build: { context: ., target: app }
    command: ['pnpm', '--filter', '@magnox/realtime', 'start']
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-cache: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    build: { context: ., target: app }
    command: ['pnpm', '--filter', '@magnox/worker', 'start']
    environment: *app-env
    # Re-hosts link preview images into the same upload store.
    volumes: [media:/data/media]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-queue: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

  caddy:
    build: { context: ./docker, dockerfile: caddy.Dockerfile }
    # 8443 carries uploads when the site is reached by IP address (no domain).
    ports: ['80:80', '443:443', '8443:8443']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      MEDIA_ADDRESS: ${MEDIA_ADDRESS:-media.localhost}
    volumes:
      - media:/srv/media:ro
      - caddydata:/data
    depends_on: [web, realtime]
    restart: unless-stopped

volumes:
  pgdata:
  redisqueue:
  media:
  caddydata:
