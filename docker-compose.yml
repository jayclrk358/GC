# Full Magnox stack. `docker compose up --build` then open https://localhost
# For local development you can start only the backing services:
#   docker compose up -d postgres redis-queue redis-cache minio mailpit
name: magnox

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: ${APP_URL:-https://localhost}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  DATABASE_URL: postgres://magnox:${POSTGRES_PASSWORD:-magnox}@postgres:5432/magnox
  REDIS_QUEUE_URL: redis://redis-queue:6379/0
  REDIS_CACHE_URL: redis://redis-cache:6379/0
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: magnox
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-magnox}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-magnox-minio-secret}
  MEDIA_BASE_URL: ${MEDIA_BASE_URL:-https://media.localhost}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  EMAIL_FROM: ${EMAIL_FROM:-Magnox <no-reply@magnox.local>}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
  TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: magnox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magnox}
      POSTGRES_DB: magnox
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U magnox']
      interval: 5s
      retries: 10

  # BullMQ requires noeviction and persistence.
  redis-queue:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redisqueue:/data]
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s

  # Caches, rate limits, presence and Socket.IO pub/sub. Evicts least-recently-used keys.
  redis-cache:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-magnox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-magnox-minio-secret}
    volumes: [media:/data]
    ports: ['9000:9000', '9001:9001']

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-magnox} $${MINIO_ROOT_PASSWORD:-magnox-minio-secret}; do sleep 1; done;
      mc mb --ignore-existing local/magnox;
      mc anonymous set download local/magnox;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-magnox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-magnox-minio-secret}

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']

  migrate:
    build: { context: ., target: app }
    command: ['pnpm', 'db:migrate']
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_REALTIME_URL: ''
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-cache: { condition: service_healthy }
    restart: unless-stopped

  realtime:
    build: { context: ., target: app }
    command: ['pnpm', '--filter', '@magnox/realtime', 'start']
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-cache: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    build: { context: ., target: app }
    command: ['pnpm', '--filter', '@magnox/worker', 'start']
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-queue: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    ports: ['80:80', '443:443']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      MEDIA_ADDRESS: ${MEDIA_ADDRESS:-media.localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web, realtime, minio]
    restart: unless-stopped

volumes:
  pgdata:
  redisqueue:
  media:
  caddydata:
