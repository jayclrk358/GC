# Full Magnox stack. `docker compose up --build` then open https://localhost
# For local development you can start only the backing services:
#   docker compose up -d postgres redis-queue redis-cache mailpit
# On a server, add the production overrides (see docker-compose.prod.yml).
name: magnox

# Keep container logs from filling the disk.
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-app-env: &app-env
  NODE_ENV: production
  # Fewer glibc memory arenas: much less memory held (and fragmented) by image processing.
  MALLOC_ARENA_MAX: '2'
  APP_URL: ${APP_URL:-https://localhost}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  # The bundled Postgres and Redis. To use hosted ones instead, set the EXTERNAL_* values in
  # .env and add docker-compose.external.yml (see the README). The plain DATABASE_URL/REDIS_*
  # values in .env are for development and aren't used here.
  DATABASE_URL: ${EXTERNAL_DATABASE_URL:-postgres://magnox:${POSTGRES_PASSWORD:-magnox}@postgres:5432/magnox}
  DATABASE_PREPARE: ${EXTERNAL_DATABASE_PREPARE:-true}
  REDIS_QUEUE_URL: ${EXTERNAL_REDIS_QUEUE_URL:-redis://redis-queue:6379/0}
  REDIS_CACHE_URL: ${EXTERNAL_REDIS_CACHE_URL:-redis://redis-cache:6379/0}
  # Uploads go to the shared `media` volume and Caddy serves them from MEDIA_ADDRESS. To use S3
  # (or R2, B2...) instead, set STORAGE_DRIVER=s3, the S3_* values and MEDIA_BASE_URL in .env.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /data/media
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-magnox}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  MEDIA_BASE_URL: ${MEDIA_BASE_URL:-https://media.localhost}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  EMAIL_FROM: ${EMAIL_FROM:-Magnox <no-reply@magnox.local>}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
  TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PLUS_MONTHLY: ${STRIPE_PRICE_PLUS_MONTHLY:-}
  STRIPE_PRICE_PLUS_YEARLY: ${STRIPE_PRICE_PLUS_YEARLY:-}
  STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
  STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
  # Push notifications (Web Push). Blank: push is off.
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  # Voice channels (the livekit service below). Blank key: voice is off.
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  # LiveKit's API, from the app's side (another address if LiveKit runs elsewhere).
  LIVEKIT_API_URL: ${LIVEKIT_API_URL:-http://livekit:7880}
  LIVEKIT_URL: ${LIVEKIT_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    # JIT compiles plans for big analytical queries and only slows the short ones this app runs.
    command: ['postgres', '-c', 'jit=off', '-c', 'shared_buffers=256MB', '-c', 'max_connections=60']
    shm_size: 256mb
    logging: *logging
    environment:
      POSTGRES_USER: magnox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magnox}
      POSTGRES_DB: magnox
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U magnox']
      interval: 10s
      start_period: 30s
      retries: 10

  # BullMQ requires noeviction and persistence.
  redis-queue:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redisqueue:/data]
    ports: ['6379:6379']
    logging: *logging
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      start_period: 20s

  # Caches, rate limits, presence and Socket.IO pub/sub. Evicts least-recently-used keys, and
  # isn't saved to disk (everything in it is rebuilt as people use the site).
  redis-cache:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    ports: ['6380:6379']
    logging: *logging
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    logging: *logging
    ports: ['8025:8025', '1025:1025']

  # Applies migrations and loads the game catalog (both safe to repeat), then exits.
  migrate:
    build: { context: ., target: app }
    command: ['sh', '-c', 'pnpm db:migrate && pnpm --filter @magnox/db seed']
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_REALTIME_URL: ''
    environment: *app-env
    volumes: [media:/data/media]
    logging: *logging
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-cache: { condition: service_healthy }
    restart: unless-stopped

  # One node process each (not pnpm → tsx → node), which saves ~100 MB per container.
  realtime:
    build: { context: ., target: app }
    command: ['node', '--import', 'tsx', 'apps/realtime/src/index.ts']
    environment: *app-env
    logging: *logging
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-cache: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    build: { context: ., target: app }
    command: ['node', '--import', 'tsx', 'apps/worker/src/index.ts']
    environment: *app-env
    logging: *logging
    # Re-hosts link preview images into the same upload store.
    volumes: [media:/data/media]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-queue: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

  # Voice channels. Start it with `--profile voice` (or COMPOSE_PROFILES=voice in .env) once
  # LIVEKIT_API_KEY/SECRET are in .env, and open 7881/tcp and 7882/udp on the firewall: the
  # audio goes straight there, not through Caddy.
  # For more voice capacity, run more of these on other servers with a shared Redis (see README).
  livekit:
    image: livekit/livekit-server:v1.10.1
    profiles: [voice]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          # The address browsers send audio to. Found automatically on a server with a public IP;
          # on a home network set LIVEKIT_NODE_IP to the server's LAN IP and this to false.
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: ${LIVEKIT_NODE_IP:-}
        keys:
          ${LIVEKIT_API_KEY:-unset}: ${LIVEKIT_API_SECRET:-unset}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-unset}
          urls: ['http://web:3000/api/voice/webhook']
        room:
          empty_timeout: 60
        logging:
          level: info
    ports: ['7881:7881', '7882:7882/udp']
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 2m

  caddy:
    build: { context: ./docker, dockerfile: caddy.Dockerfile }
    # 8443 carries uploads when the site is reached by IP address (no domain).
    ports: ['80:80', '443:443', '8443:8443']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      MEDIA_ADDRESS: ${MEDIA_ADDRESS:-media.localhost}
    logging: *logging
    volumes:
      - media:/srv/media:ro
      - caddydata:/data
    depends_on: [web, realtime]
    restart: unless-stopped

volumes:
  pgdata:
  redisqueue:
  media:
  caddydata:
