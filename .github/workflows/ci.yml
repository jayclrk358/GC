name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end & accessibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamecentral
          POSTGRES_PASSWORD: gamecentral
          POSTGRES_DB: gamecentral
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gamecentral" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdefghijklmnop
      DATABASE_URL: postgres://gamecentral:gamecentral@localhost:5432/gamecentral
      REDIS_QUEUE_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
      NEXT_PUBLIC_REALTIME_URL: http://localhost:3001
      MEDIA_BASE_URL: http://localhost:3000/media
      NODE_ENV: test
      # The LiveKit server started below, for the voice tests (test-only keys).
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_URL: http://localhost:7880
      LIVEKIT_API_KEY: ci-key
      LIVEKIT_API_SECRET: ci-secret-0123456789abcdefghijklmnop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gamecentral/web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @gamecentral/web build
        env:
          NODE_ENV: production
      - name: Start LiveKit (voice channels)
        run: |
          curl -fsSL https://github.com/livekit/livekit/releases/download/v1.10.1/livekit_1.10.1_linux_amd64.tar.gz |
            tar -xz -C "$RUNNER_TEMP" livekit-server
          nohup "$RUNNER_TEMP/livekit-server" --config .github/livekit-ci.yaml > "$RUNNER_TEMP/livekit.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:7880 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/livekit.log"; exit 1
      - run: pnpm test:e2e
        env:
          E2E_PROD: '1'
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
