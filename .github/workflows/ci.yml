name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end & accessibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: magnox
          POSTGRES_PASSWORD: magnox
          POSTGRES_DB: magnox
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U magnox" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdefghijklmnop
      DATABASE_URL: postgres://magnox:magnox@localhost:5432/magnox
      REDIS_QUEUE_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
      NEXT_PUBLIC_REALTIME_URL: http://localhost:3001
      MEDIA_BASE_URL: http://localhost:3000/media
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @magnox/web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @magnox/web build
        env:
          NODE_ENV: production
      - run: pnpm test:e2e
        env:
          E2E_PROD: '1'
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
