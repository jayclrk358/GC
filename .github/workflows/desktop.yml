name: Windows app

# Builds the Game Central for Windows installer whenever the app changes, or on demand from the
# Actions tab (optionally for another Game Central site). Download it from the run's artifacts.
on:
  push:
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      url:
        description: 'Game Central site the app opens (leave empty for the one in apps/desktop/package.json)'
        required: false

jobs:
  build:
    name: Build the Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Build
        env:
          GAMECENTRAL_URL: ${{ inputs.url }}
        run: |
          if [ -n "$GAMECENTRAL_URL" ]; then
            npm run dist -- "-c.extraMetadata.siteUrl=$GAMECENTRAL_URL"
          else
            npm run dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GameCentral-Windows-installer
          path: apps/desktop/release/GameCentral-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  certify:
    name: Windows App Certification Kit
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GameCentral-Windows-installer
          path: installer
      - name: Run the Windows App Certification Kit
        shell: pwsh
        run: |
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $kit)) {
            Write-Output "::error::The Windows App Certification Kit isn't installed on this runner."
            exit 1
          }
          $setup = (Get-ChildItem installer\GameCentral-Setup-*.exe | Select-Object -First 1).FullName
          $report = Join-Path $env:RUNNER_TEMP 'wack-report.xml'
          $out = Join-Path $env:RUNNER_TEMP 'wack-output.txt'
          & $kit reset | Out-Host
          # Installs the app silently (per user, as the installer does), checks it, and uninstalls
          # it again. Run in the background so a test waiting on a window can't hang the job: the
          # windows open along the way are noted, and it's stopped after 25 minutes.
          $proc = Start-Process -FilePath $kit -PassThru -NoNewWindow -RedirectStandardOutput $out -ArgumentList @(
            'test', '-apptype', 'desktop', '-setuppath', "`"$setup`"", '-setupcommandline', '/S',
            '-appusage', 'peruser', '-reportoutputpath', "`"$report`"")
          $seen = ''
          $notes = 0
          $deadline = (Get-Date).AddMinutes(25)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            $windows = (Get-Process | Where-Object { $_.MainWindowTitle } |
              ForEach-Object { "$($_.ProcessName): $($_.MainWindowTitle)" }) -join '; '
            if ($windows -ne $seen) {
              $seen = $windows
              $minutes = [int]((Get-Date) - $proc.StartTime).TotalMinutes
              Write-Output "[$minutes min] Windows open: $windows"
              if ($notes -lt 8) { Write-Output "::notice title=Certification kit, $minutes min in::Windows open: $windows"; $notes++ }
            }
          }
          if (-not $proc.HasExited) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $image = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($image).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $image.Save("$PWD\wack-stuck.png")
            $last = (Get-Content $out -Tail 6 -ErrorAction SilentlyContinue) -join ' / '
            # What the open windows say (a dialog waiting for an answer, say).
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $said = foreach ($p in Get-Process | Where-Object { $_.MainWindowTitle }) {
              $mine = New-Object System.Windows.Automation.PropertyCondition(
                [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
              $parts = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants, $mine)
              "$($p.ProcessName): " + (($parts | ForEach-Object { $_.Current.Name } | Where-Object { $_ }) -join ' | ')
            }
            Write-Output "::error title=Certification kit didn't finish::Still running after 25 minutes. Windows open: $seen. They say: $($said -join ' // '). Last output: $last"
            Stop-Process -Id $proc.Id -Force
            Get-Process 'Game Central', 'Uninstall Game Central' -ErrorAction SilentlyContinue | Stop-Process -Force
            exit 1
          }
          Get-Content $out -ErrorAction SilentlyContinue | Out-Host
          if (-not (Test-Path $report)) {
            & $kit /? | Out-Host
            $last = (Get-Content $out -Tail 6 -ErrorAction SilentlyContinue) -join ' / '
            Write-Output "::error title=Certification kit failed::No report (exit code $($proc.ExitCode)). Last output: $last"
            exit 1
          }
          Copy-Item $report wack-report.xml
          [xml]$xml = Get-Content $report
          $overall = $xml.DocumentElement.GetAttribute('OVERALL_RESULT')
          $rows = foreach ($test in $xml.SelectNodes('//TEST')) {
            $result = $test.SelectSingleNode('RESULT').InnerText.Trim()
            $why = ($test.SelectNodes('MESSAGES/MESSAGE') | ForEach-Object { $_.GetAttribute('TEXT') }) -join ' '
            [pscustomobject]@{ Result = $result; Test = $test.GetAttribute('NAME'); Details = $why }
          }
          $rows | Format-Table -AutoSize -Wrap | Out-String -Width 4096 | Write-Output
          "## Windows App Certification Kit: $overall" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '| Result | Test | Details |' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '| --- | --- | --- |' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($row in $rows) {
            "| $($row.Result) | $($row.Test) | $($row.Details -replace '\|', '/') |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          $failed = @($rows | Where-Object { $_.Result -eq 'FAIL' })
          foreach ($row in $failed | Select-Object -First 5) {
            Write-Output "::warning title=Certification kit: $($row.Test)::$($row.Details)"
          }
          # The whole entry for each failed test, and what the kit said about failures along the
          # way, so the reason is readable without downloading the report.
          foreach ($test in $xml.SelectNodes('//TEST') | Where-Object { $_.SelectSingleNode('RESULT').InnerText.Trim() -eq 'FAIL' } | Select-Object -First 3) {
            $entry = ($test.OuterXml -replace '\s+', ' ')
            Write-Output "::notice title=Certification kit report entry::$($entry.Substring(0, [Math]::Min(3500, $entry.Length)))"
          }
          $lines = @(Get-Content $out -ErrorAction SilentlyContinue)
          $at = [Array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($l) $l -match 'failed to install' })
          if ($at -ge 0) {
            $around = ($lines[[Math]::Max(0, $at - 30)..$at] | ForEach-Object { $_.Trim() }) -join ' / '
            Write-Output "::notice title=Certification kit output before the failed install::$($around.Substring([Math]::Max(0, $around.Length - 3500)))"
          }
          # Two results come from the installer rather than the app (see the README): signing needs
          # a code-signing certificate, and the installer doesn't finish under the kit's simulated
          # newer Windows. Anything else failing turns the job red.
          $ours = @($failed | Where-Object { $_.Test -notmatch 'sign|OS version' })
          if ($ours.Count) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-App-Certification-Kit-report
          path: |
            wack-report.xml
            wack-stuck.png
          if-no-files-found: ignore
          retention-days: 30
