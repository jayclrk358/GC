# LiveKit for the voice tests in CI (see ci.yml). The keys are for these tests only.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
keys:
  ci-key: ci-secret-0123456789abcdefghijklmnop
webhook:
  api_key: ci-key
  urls: ['http://localhost:3000/api/voice/webhook']
room:
  empty_timeout: 30
logging:
  level: info
