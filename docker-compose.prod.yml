# Overrides for running Magnox on a server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only Caddy (ports 80 and 443) is reachable from other machines. The databases aren't published
# at all, and the Mailpit inbox listens on this machine only (from elsewhere, use an SSH tunnel:
# ssh -L 8025:localhost:8025 you@server). Everything restarts after a reboot.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis-queue:
    ports: !reset []
    restart: unless-stopped
  redis-cache:
    ports: !reset []
    restart: unless-stopped
  mailpit:
    ports: !override ['127.0.0.1:8025:8025']
    restart: unless-stopped
