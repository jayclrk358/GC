<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <title>Server address</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Server address</h1>
      <form id="form" novalidate>
        <p><label for="url">Which Game Central site should the app show?</label></p>
        <input
          type="text"
          id="url"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          aria-describedby="hint error"
        />
        <p class="muted" id="hint">For example, gamecentral.example.com.</p>
        <p class="error" id="error" role="alert"></p>
        <div class="actions">
          <button type="button" id="reset" class="start">Use the default</button>
          <button type="button" id="cancel">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </main>
    <script src="server.js"></script>
  </body>
</html>
